[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psa-sdk"
version = "0.2.0"
description = "PSA SDK: reads model behaviour from its output, one reply at a time (analyze, MCP, Langfuse, ElevenLabs)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
fastapi = ["fastapi>=0.100"]
langfuse = ["langfuse>=4.0"]
elevenlabs = ["websockets>=12.0"]
all = [
    "mcp>=1.0",
    "fastapi>=0.100",
    "langfuse>=4.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://splabs.io"
Repository = "https://github.com/SiliconPsycheLabs/splabs"
Documentation = "https://splabs.io/api/docs"

[tool.hatch.build.targets.wheel]
packages = ["psa"]
