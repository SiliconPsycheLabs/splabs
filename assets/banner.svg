<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Silicon Psyche Labs: we understand models, and we fine-tune them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- a drifting trace, read then brought back -->
  <path d="M760 210 C820 210 840 120 900 140 S990 260 1050 200 S1140 150 1220 160" fill="none" stroke="#f472b6" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="6 8"/>
  <path d="M760 210 C840 200 900 175 980 170 S1140 165 1220 160" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
  <g fill="#e0e7ff">
    <circle cx="760" cy="210" r="7"/>
    <circle cx="980" cy="170" r="6"/>
    <circle cx="1220" cy="160" r="7"/>
  </g>
  <rect x="64" y="58" width="58" height="58" rx="12" fill="#e0e7ff"/>
  <text x="93" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#312e81">SPL</text>
  <text x="140" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Silicon Psyche Labs</text>
  <text x="64" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">We understand models,</text>
  <text x="64" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#c7d2fe">and we fine-tune them.</text>
  <rect x="64" y="258" width="560" height="2" fill="url(#line)"/>
  <text x="64" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c7d2fe" letter-spacing="2">READ  ·  CORRECT  ·  VERIFY</text>
</svg>
